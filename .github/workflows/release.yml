name: Release

on:
  push:
    tags: ["v*"]

# Serialize runs per tag so rapid consecutive tag pushes never cancel an
# intermediate release. Cross-tag races on the same store item are prevented
# by publish-cws.mjs, which refuses to publish a version older than the
# store's current revision. A rerun must never cancel the run it replaces.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The script has idempotency guards, so a generous cap only protects
    # against transient store/network slowness.
    timeout-minutes: 60
    env:
      # Non-secret marker so the step-level if can decide without exposing
      # the service-account key to every step of the job. A missing publisher
      # ID intentionally fails the step (via the script) instead of silently
      # skipping the store submission.
      CWS_CONFIGURED: ${{ secrets.CWS_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit
      - name: Verify tag and package
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./manifest.json').version")"
          npm run package
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Scan release with ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
          clamscan --infected --recursive release
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: a release that already exists is always a partial
          # previous run. Drop assets that are no longer produced, then
          # replace the whole set with --clobber so the ZIP and its checksum
          # come from the same build.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | \
              while read -r asset; do
                [ -e "release/$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi

      - name: Warn when Chrome Web Store publishing is not configured
        if: ${{ env.CWS_CONFIGURED != 'true' }}
        run: |
          echo "::warning::CWS_SERVICE_ACCOUNT is not set; the Chrome Web Store submission is skipped. Set the secret to enable automatic store publishing."

      - name: Download the published release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          zip_name="NTU-COOL-video-downloader-${version}.zip"
          mkdir -p /tmp/cws-asset
          # Reuse the ZIP published on the GitHub release so the store
          # submission always matches the release assets, even on retries
          # where a fresh build could produce a different digest.
          gh release download "$GITHUB_REF_NAME" --pattern "$zip_name" --dir /tmp/cws-asset
          echo "CWS_ZIP=/tmp/cws-asset/$zip_name" >> "$GITHUB_ENV"

      - name: Upload and publish to Chrome Web Store
        if: ${{ env.CWS_CONFIGURED == 'true' }}
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          node scripts/publish-cws.mjs --upload "$CWS_ZIP" --publish
