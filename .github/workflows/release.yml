name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Non-secret marker so the step-level if can decide without exposing
      # the service-account key to every step of the job. A missing publisher
      # ID intentionally fails the step (via the script) instead of silently
      # skipping the store submission.
      CWS_CONFIGURED: ${{ secrets.CWS_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Verify tag and package
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./manifest.json').version")"
          npm run package
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Scan release with ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
          clamscan --infected --recursive release
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: re-running a failed job must neither collide with an
          # already-created release nor leave it missing assets or stuck as a
          # draft.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [ "$draft" = "true" ]; then
              # A draft means a previous run stopped mid-way; replace the
              # whole asset set so the ZIP and its checksum come from the
              # same build, then publish it.
              gh release upload "$GITHUB_REF_NAME" release/* --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              # Already published: only fill in assets that are missing.
              for file in release/*; do
                if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
                    | grep -Fxq "$(basename "$file")"; then
                  gh release upload "$GITHUB_REF_NAME" "$file"
                fi
              done
            fi
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi

      - name: Upload and publish to Chrome Web Store
        if: ${{ env.CWS_CONFIGURED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          zip_name="NTU-COOL-video-downloader-${version}.zip"
          mkdir -p /tmp/cws-asset
          # Reuse the ZIP published on the GitHub release so the store
          # submission always matches the release assets, even on retries
          # where a fresh build could produce a different digest.
          gh release download "$GITHUB_REF_NAME" --pattern "$zip_name" --dir /tmp/cws-asset
          node scripts/publish-cws.mjs --upload "/tmp/cws-asset/$zip_name" --publish
