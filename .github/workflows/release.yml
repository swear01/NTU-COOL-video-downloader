name: Release

on:
  push:
    tags: ["v*"]

# Serialize runs per tag so rapid consecutive tag pushes never cancel an
# intermediate release. Cross-tag races on the same store item are prevented
# by publish-cws.mjs, which refuses to publish a version older than the
# store's current revision. A rerun must never cancel the run it replaces.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The script has idempotency guards, so a generous cap only protects
    # against transient network slowness.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit
      - name: Verify tag and package
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./manifest.json').version")"
          npm run package
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Scan release with ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
          clamscan --infected --recursive release
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: a release that already exists is always a partial
          # previous run. Drop assets that are no longer produced, then
          # replace the whole set with --clobber so the ZIP and its checksum
          # come from the same build. Only assets matching this workflow's
          # naming pattern are removed, and only a draft is published.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | \
              while read -r asset; do
                case "$asset" in
                  NTU-COOL-video-downloader-*.zip|SHA256SUMS)
                    [ -e "release/$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
                esac
              done
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi

  store:
    needs: release
    runs-on: ubuntu-latest
    # The Chrome Web Store credentials live in this environment, so no other
    # workflow or job can read them. Setting required reviewers on the
    # environment turns the automatic store submission into an approved step;
    # without reviewers it runs automatically.
    environment: cws-publish
    timeout-minutes: 15
    env:
      # Non-secret marker so step-level if conditions can decide without
      # exposing the service-account key. A missing publisher ID fails the
      # script loudly instead of silently skipping the submission.
      CWS_CONFIGURED: ${{ secrets.CWS_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Warn when Chrome Web Store publishing is not configured
        if: ${{ env.CWS_CONFIGURED != 'true' }}
        run: |
          echo "::warning::CWS_SERVICE_ACCOUNT is not set; the Chrome Web Store submission is skipped. Set the secret in the cws-publish environment to enable automatic store publishing. (A set service account with a missing CWS_PUBLISHER_ID fails the job loudly instead.)"

      - name: Download the published release ZIP
        if: ${{ env.CWS_CONFIGURED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          zip_name="NTU-COOL-video-downloader-${version}.zip"
          mkdir -p /tmp/cws-asset
          # Reuse the ZIP published on the GitHub release so the store
          # submission always matches the release assets, even on retries
          # where a fresh build could produce a different digest.
          gh release download "$GITHUB_REF_NAME" --pattern "$zip_name" --dir /tmp/cws-asset
          echo "CWS_ZIP=/tmp/cws-asset/$zip_name" >> "$GITHUB_ENV"

      - name: Upload and publish to Chrome Web Store
        if: ${{ env.CWS_CONFIGURED == 'true' }}
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          node scripts/publish-cws.mjs --upload "$CWS_ZIP" --publish
