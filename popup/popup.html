<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NTU COOL Video Downloader</title>
  <style>
    body { width: 280px; margin: 0; padding: 18px; color: #202124; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 14px; font-size: 17px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 10px; color: white; background: #137333; font-weight: 600; cursor: pointer; }
    button:disabled { cursor: default; background: #9aa0a6; }
    #status { margin: 12px 0 0; line-height: 1.4; }
    progress { width: 100%; margin-top: 12px; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <h1>NTU COOL Video Downloader</h1>
  <button id="download" disabled>Download video</button>
  <progress id="progress" max="100" value="0" hidden></progress>
  <p id="status">Looking for a native NTU COOL video…</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
